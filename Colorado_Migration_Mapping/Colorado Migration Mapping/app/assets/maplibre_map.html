<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/maplibre-gl.css">
<script src="/assets/maplibre-gl.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; overflow:hidden; }
  #map { width:100%; height:100vh; }
  .maplibregl-popup-content {
    background: rgba(20, 20, 30, 0.95);
    color: #e0e0e0;
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    line-height: 1.6;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    border: 1px solid #335;
    max-width: 280px;
  }
  .maplibregl-popup-close-button {
    color: #999;
    font-size: 16px;
    padding: 2px 6px;
  }
  .maplibregl-popup-close-button:hover { color: #fff; }
  .popup-title { color: #8FCFFF; font-weight: bold; margin-bottom: 4px; font-size: 11px; }
  .popup-row { display: flex; justify-content: space-between; padding: 1px 0; }
  .popup-label { color: #B0B0B0; }
  .popup-value { color: #fff; font-weight: bold; }
  .popup-divider { border-top: 1px solid #334; margin: 4px 0; }
  /* Prev/Next navigation row at the top of the GPS-fix popup */
  .popup-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; gap: 6px; }
  .popup-navbtn {
    background: #223; color: #8FCFFF; border: 1px solid #335; border-radius: 3px;
    cursor: pointer; font-size: 12px; line-height: 1; padding: 3px 9px;
  }
  .popup-navbtn:hover:not(:disabled) { color: #fff; border-color: #56B4E9; }
  .popup-navbtn:disabled { opacity: 0.35; cursor: default; }
  .popup-navlabel { color: #B0B0B0; font-size: 10px; white-space: nowrap; }
  /* Box-select rectangle */
  #box-select {
    position: absolute;
    border: 2px dashed #FFFF66;
    background: rgba(255, 255, 102, 0.15);
    pointer-events: none;
    display: none;
    z-index: 1000;
  }
  /* Small status banner top-right */
  #sel-banner {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(20,20,30,0.85);
    color: #FFFF66;
    border: 1px solid #FFFF66;
    border-radius: 4px;
    padding: 3px 8px;
    font-family: 'Consolas', monospace;
    font-size: 11px;
    display: none;
    z-index: 1000;
    pointer-events: none;
  }
  /* Map key / legend — 'ⓘ' button above the attribution, toggles a panel */
  #legend-btn {
    position: absolute; bottom: 40px; right: 8px; z-index: 1000;
    padding: 6px 12px; border-radius: 4px;
    background: rgba(20,20,30,0.9); color: #8FCFFF; border: 1px solid #335;
    font: bold 14px sans-serif; line-height: 1; cursor: pointer;
  }
  #legend-btn:hover { color: #fff; border-color: #56B4E9; }
  #legend-panel {
    position: absolute; bottom: 80px; right: 8px; z-index: 1000;
    background: rgba(20,20,30,0.95); color: #e0e0e0; border: 1px solid #335;
    border-radius: 6px; padding: 8px 10px; max-width: 220px;
    font: 11px 'Consolas', 'Monaco', monospace; display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #legend-panel.open { display: block; }
  #legend-panel .legend-title { color: #8FCFFF; font-weight: bold; margin-bottom: 5px; }
  #legend-panel .legend-row { display: flex; align-items: center; padding: 2px 0; }
  #legend-panel .legend-swatch { width: 16px; height: 16px; margin-right: 7px; flex: 0 0 auto; text-align: center; }
  #legend-panel .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); display: inline-block; vertical-align: middle; }
  #legend-panel img.legend-icon { width: 16px; height: 16px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>
<div id="box-select"></div>
<div id="sel-banner"></div>
<button id="legend-btn" title="Map key">ⓘ Key</button>
<div id="legend-panel"></div>
<script>
// Default labels for raster vars; merged at runtime with WLD labels pushed
// from the Dash app via {type:'update-data', env_labels: {...}}.
let LABELS = {
  elevation_m: 'Elevation',
  snow_depth_m: 'Snow Depth',
  swe_m: 'SWE',
  snow_density_kgm3: 'Snow Density',
};
const UNITS = {
  elevation_m: 'm',
  snow_depth_m: 'm',
  swe_m: 'm',
  snow_density_kgm3: 'kg/m³',
};

// Selection state: a Set of ISO-date keys (the `d` property on each feature).
// Persists for the lifetime of the iframe; reset when the user navigates to
// a new animal (parent sends type:'clear-selection').
let selectedKeys = new Set();
// Cached copy of the latest points GeoJSON so flash-point lookups can find
// off-screen features (querySourceFeatures only returns viewport features).
let pointsData = { type: 'FeatureCollection', features: [] };

function formatVal(key, val) {
  if (val == null || val === undefined) return '—';
  if (typeof val !== 'number') return String(val);
  if (key === 'elevation_m') return val.toFixed(0) + ' m';
  if (key === 'snow_density_kgm3') return val.toFixed(0) + ' kg/m³';
  if (UNITS[key]) return val.toFixed(3) + ' ' + UNITS[key];
  // WLD vars or anything else: pick precision based on magnitude
  if (Math.abs(val) >= 100) return val.toFixed(1);
  if (Math.abs(val) >= 1) return val.toFixed(2);
  return val.toFixed(3);
}

// ---- Flagged-fix icons (shared by the map symbol layer AND the legend key,
// so the two never drift). Drawn on a canvas — no glyph font / image file. ----
function _drawProblemIcon(ctx, s) {
  ctx.clearRect(0, 0, s, s);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(s / 2, s * 0.12);
  ctx.lineTo(s * 0.90, s * 0.86);
  ctx.lineTo(s * 0.10, s * 0.86);
  ctx.closePath();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = s * 0.12; ctx.stroke();   // white halo
  ctx.fillStyle = '#F57C00'; ctx.fill();                                 // amber
  ctx.fillStyle = '#ffffff';
  var bw = s * 0.10;
  ctx.fillRect(s / 2 - bw / 2, s * 0.38, bw, s * 0.26);                  // "!" bar
  ctx.beginPath(); ctx.arc(s / 2, s * 0.76, bw * 0.75, 0, 2 * Math.PI); ctx.fill();  // "!" dot
}
function _drawMortalityIcon(ctx, s) {
  ctx.clearRect(0, 0, s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(s / 2, s / 2, s * 0.36, 0, 2 * Math.PI);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = s * 0.11; ctx.stroke();   // white halo
  ctx.fillStyle = '#141414'; ctx.fill();                                 // near-black
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = s * 0.12;
  var o = s * 0.19;
  ctx.beginPath();
  ctx.moveTo(s / 2 - o, s / 2 - o); ctx.lineTo(s / 2 + o, s / 2 + o);
  ctx.moveTo(s / 2 + o, s / 2 - o); ctx.lineTo(s / 2 - o, s / 2 + o);
  ctx.stroke();                                                          // white X
}
function _iconCanvas(size, draw) {
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  draw(c.getContext('2d'), size);
  return c;
}
function _iconToImageData(size, draw) {
  return _iconCanvas(size, draw).getContext('2d').getImageData(0, 0, size, size);
}
function _iconToDataURL(size, draw) {
  return _iconCanvas(size, draw).toDataURL();
}

// ---- Map legend / key. Sequence rows are pushed from Dash ('set-legend') so
// their colours/names/count stay identical to the point GeoJSON. Static rows
// (Unassigned / Problem / Mortality) are drawn here. ----
var _legendSeqs = [];
function buildLegend() {
  var panel = document.getElementById('legend-panel');
  if (!panel) return;
  var dot = function (color) {
    return '<span class="legend-dot" style="background:' + color + '"></span>';
  };
  var html = '<div class="legend-title">Map Key</div>';
  for (var i = 0; i < _legendSeqs.length; i++) {
    var sq = _legendSeqs[i] || {};
    html += '<div class="legend-row"><span class="legend-swatch">' + dot(sq.color || '#888') +
            '</span><span>' + (sq.name || ('mig' + (i + 1))) + '</span></div>';
  }
  html += '<div class="legend-row"><span class="legend-swatch">' + dot('#000000') +
          '</span><span>Unassigned</span></div>';
  html += '<div class="legend-row"><img class="legend-swatch legend-icon" src="' +
          _iconToDataURL(32, _drawProblemIcon) + '"><span>Problem point</span></div>';
  html += '<div class="legend-row"><img class="legend-swatch legend-icon" src="' +
          _iconToDataURL(32, _drawMortalityIcon) + '"><span>Mortality point</span></div>';
  panel.innerHTML = html;
}
(function wireLegendButton() {
  var btn = document.getElementById('legend-btn');
  var panel = document.getElementById('legend-panel');
  if (!btn || !panel) return;
  btn.addEventListener('click', function () {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) buildLegend();
  });
})();

// ---- GPS-fix popup with Prev/Next navigation through the (chronological)
// points. Called on point click (recenter=false) and by the ◀/▶ buttons
// (recenter=true, so an off-screen neighbour is brought into view). pointsData
// is already timestamp-ordered, so index±1 is the next/previous fix — including
// flagged fixes. ----
var _popupIndex = -1;
function openPopupAtIndex(idx, recenter) {
  var feats = (pointsData && pointsData.features) || [];
  if (!feats.length) return;
  if (idx < 0) idx = 0;
  if (idx > feats.length - 1) idx = feats.length - 1;
  var f = feats[idx];
  var p = f.properties || {};
  var coords = f.geometry.coordinates.slice();
  _popupIndex = idx;

  var html = '<div class="popup-nav">';
  html += '<button type="button" class="popup-navbtn" data-nav="prev"' + (idx <= 0 ? ' disabled' : '') + '>&#9664;</button>';
  html += '<span class="popup-navlabel">Fix ' + (idx + 1) + ' / ' + feats.length + '</span>';
  html += '<button type="button" class="popup-navbtn" data-nav="next"' + (idx >= feats.length - 1 ? ' disabled' : '') + '>&#9654;</button>';
  html += '</div>';
  html += '<div class="popup-title">GPS Fix</div>';
  html += '<div class="popup-row"><span class="popup-label">Date</span><span class="popup-value">' + (p.d || '—') + '</span></div>';
  html += '<div class="popup-row"><span class="popup-label">Lat</span><span class="popup-value">' + coords[1].toFixed(5) + '</span></div>';
  html += '<div class="popup-row"><span class="popup-label">Lon</span><span class="popup-value">' + coords[0].toFixed(5) + '</span></div>';
  if (p.dop !== undefined && p.dop !== null) {
    html += '<div class="popup-row"><span class="popup-label">DOP</span><span class="popup-value">' + p.dop + '</span></div>';
  }
  if (p.nsat !== undefined && p.nsat !== null) {
    html += '<div class="popup-row"><span class="popup-label">Satellites</span><span class="popup-value">' + p.nsat + '</span></div>';
  }
  if (p.f) {
    html += '<div class="popup-row"><span class="popup-label">Flag</span><span class="popup-value">' + p.f + '</span></div>';
    if (p.f === 'problem' && p.pr) {
      html += '<div class="popup-row"><span class="popup-label">Reason</span><span class="popup-value" style="color:#FCA5A5">' + p.pr + '</span></div>';
    }
    if (p.f === 'mortality' && p.mr) {
      html += '<div class="popup-row"><span class="popup-label">Reason</span><span class="popup-value" style="color:#B0B0B0">' + p.mr + '</span></div>';
    }
  }
  var reservedProps = new Set(['c', 'd', 'f', 'pr', 'mr', 'dop', 'nsat']);
  var envKeys = [];
  for (var k in p) {
    if (!Object.prototype.hasOwnProperty.call(p, k)) continue;
    if (reservedProps.has(k)) continue;
    if (p[k] === undefined || p[k] === null) continue;
    envKeys.push(k);
  }
  if (envKeys.length > 0) {
    html += '<div class="popup-divider"></div>';
    for (var j = 0; j < envKeys.length; j++) {
      var kk = envKeys[j];
      var val = typeof p[kk] === 'string' ? parseFloat(p[kk]) : p[kk];
      var label = LABELS[kk] || kk;
      html += '<div class="popup-row"><span class="popup-label">' + label + '</span><span class="popup-value">' + formatVal(kk, val) + '</span></div>';
    }
  }

  if (currentPopup) { currentPopup.remove(); currentPopup = null; }
  currentPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '280px' })
    .setLngLat(coords).setHTML(html).addTo(map);
  if (recenter) map.easeTo({ center: coords, duration: 250 });

  var elm = currentPopup.getElement();
  if (elm) {
    var btns = elm.querySelectorAll('.popup-navbtn');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function (ev) {
        ev.stopPropagation();
        var dir = ev.currentTarget.getAttribute('data-nav') === 'next' ? 1 : -1;
        openPopupAtIndex(_popupIndex + dir, true);
      });
    }
  }
}

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      satellite: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256, maxzoom: 18,
        attribution: 'Esri',
      },
    },
    layers: [{ id: 'satellite', type: 'raster', source: 'satellite' }],
  },
  center: [-106.5, 39.5],
  zoom: 8, pitch: 0, bearing: 0, maxPitch: 85,
  // Native Esri imagery goes to ~z18 (the raster source's maxzoom); beyond that
  // MapLibre overzooms (upscales) those tiles — slightly blurry but lets users
  // zoom right in on tightly-clustered fixes. Was capped at 16.
  maxZoom: 20, minZoom: 4,
});

map.addControl(new maplibregl.NavigationControl(), 'top-left');

let currentPopup = null;

// Repaint the selection-halo + flag-outline layers using the current
// `selectedKeys` set and whatever GeoJSON is in animal-points.
function refreshSelectionStyling() {
  const src = map.getSource('animal-points');
  if (!src) return;
  // Build halo source from the subset of features in selectedKeys.
  const data = src._data;  // private but stable across maplibre versions we use
  if (!data || !data.features) return;
  const halos = {
    type: 'FeatureCollection',
    features: data.features.filter(f => selectedKeys.has(f.properties && f.properties.d)),
  };
  const haloSrc = map.getSource('selection-halos');
  if (haloSrc) haloSrc.setData(halos);

  // Update the banner counter
  const banner = document.getElementById('sel-banner');
  if (selectedKeys.size > 0) {
    banner.textContent = selectedKeys.size + ' point' + (selectedKeys.size === 1 ? '' : 's') + ' selected (Shift+click adds, Shift+drag = box-select)';
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}

function notifySelectionChanged() {
  window.parent.postMessage({
    type: 'selection-changed',
    selected: Array.from(selectedKeys),
  }, '*');
}

map.on('load', () => {
  // 3D terrain
  map.addSource('terrain-dem', {
    type: 'raster-dem',
    tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
    encoding: 'terrarium', tileSize: 256, maxzoom: 15,
  });
  map.setTerrain({ source: 'terrain-dem', exaggeration: 1.5 });
  map.addLayer({
    id: 'hillshade', type: 'hillshade', source: 'terrain-dem',
    paint: { 'hillshade-shadow-color': '#000', 'hillshade-exaggeration': 0.3 },
  }, 'satellite');

  // Empty sources for points and line
  map.addSource('animal-line', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
  });
  map.addSource('animal-points', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
  });
  // Halo source for selected points (drawn ABOVE the points layer).
  map.addSource('selection-halos', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
  });
  // Flash source — short-lived halo for chart-click "find this point on the
  // map" actions. One feature at a time, cleared after ~1.5 s.
  map.addSource('flash-halo', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
  });

  // Movement path line
  map.addLayer({
    id: 'animal-line-layer', type: 'line', source: 'animal-line',
    paint: { 'line-color': '#FFE680', 'line-width': 1.8, 'line-opacity': 0.7 },
    layout: { 'line-join': 'round', 'line-cap': 'round' },
  });

  // GPS points — flagged fixes render as "ghost points": hollow, faded,
  // half-radius, dashed red/grey outline. They stay on the map for context
  // but are visually demoted, signalling that they were excluded from the
  // analysis. Unflagged points keep the standard solid fill + thin black
  // border.
  //   problem    -> red ghost
  //   mortality  -> grey ghost
  map.addLayer({
    id: 'animal-points-layer', type: 'circle', source: 'animal-points',
    // Draw order within the layer: higher circle-sort-key = drawn later = on
    // top. Unassigned points carry c == '#000000' (the default in
    // _build_point_geojson); points inside a migration window carry a palette
    // colour. We prioritise the coloured (in-migration) points so a dense
    // field of black dots can't bury the selection when zoomed out.
    layout: {
      'circle-sort-key': [
        'case', ['==', ['coalesce', ['get', 'c'], '#000'], '#000000'], 0, 1,
      ],
    },
    paint: {
      // Flagged fixes (problem / mortality) render here as a small, faint GREY
      // base dot — just a click target for unflagging — with a bold icon drawn
      // on top by 'flag-icons-layer' below. Rendering them grey (not their `c`
      // value) keeps flagged points from wearing a mig-sequence colour, and the
      // icon makes them stand out by SHAPE regardless of the colour palette.
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 2.5, 12, 5, 16, 8],
      'circle-color': [
        'match', ['coalesce', ['get', 'f'], ''],
        ['problem', 'mortality'], '#9aa0a6',
        ['coalesce', ['get', 'c'], '#000'],
      ],
      'circle-opacity': [
        'match', ['coalesce', ['get', 'f'], ''],
        ['problem', 'mortality'], 0.35,
        0.9,
      ],
      'circle-stroke-color': '#000',
      'circle-stroke-width': [
        'match', ['coalesce', ['get', 'f'], ''],
        ['problem', 'mortality'], 0,
        0.4,
      ],
      'circle-stroke-opacity': 1.0,
    },
  });

  // Flagged-fix icons — a bold marker drawn ON TOP of the faint grey flagged
  // dots so problem / mortality points stand out by SHAPE (not colour) and are
  // never confused with mig-sequence points. Uses the shared _draw*Icon helpers
  // (top of script) so the map markers and the legend key match exactly.
  map.addImage('flag-problem', _iconToImageData(44, _drawProblemIcon), { pixelRatio: 2 });
  map.addImage('flag-mortality', _iconToImageData(44, _drawMortalityIcon), { pixelRatio: 2 });
  map.addLayer({
    id: 'flag-icons-layer', type: 'symbol', source: 'animal-points',
    filter: ['any', ['==', ['get', 'f'], 'problem'], ['==', ['get', 'f'], 'mortality']],
    layout: {
      'icon-image': ['match', ['get', 'f'], 'mortality', 'flag-mortality', 'flag-problem'],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 6, 0.4, 12, 0.7, 16, 1.0],
      'icon-allow-overlap': true,
      'icon-ignore-placement': true,
    },
  });

  // Selection halo layer — draws a yellow ring around selected points,
  // sits ABOVE the main points layer so it's always visible.
  map.addLayer({
    id: 'selection-halos-layer', type: 'circle', source: 'selection-halos',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 6, 12, 10, 16, 14],
      'circle-color': 'rgba(0,0,0,0)',     // transparent fill
      'circle-stroke-color': '#FFFF66',    // bright yellow
      'circle-stroke-width': 2.5,
    },
  });

  // Flash halo — sits ABOVE selection halos. Cyan ring, pulses via opacity.
  map.addLayer({
    id: 'flash-halo-layer', type: 'circle', source: 'flash-halo',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 10, 12, 16, 16, 22],
      'circle-color': 'rgba(0,0,0,0)',
      'circle-stroke-color': '#00E5FF',    // bright cyan
      'circle-stroke-width': 3.5,
      'circle-stroke-opacity': 1.0,
    },
  });

  // ----- Click handler ---------------------------------------------------
  // Plain click on a point: replace selection (unless Shift was held, in which
  // case toggle membership). Also open the popup.
  // Plain click on empty map: clear selection.
  map.on('click', (e) => {
    const isShift = e.originalEvent && e.originalEvent.shiftKey;
    const features = map.queryRenderedFeatures(e.point, {
      layers: ['animal-points-layer'],
    });
    if (!features.length) {
      // Clicked empty: clear selection (unless Shift — then keep it)
      if (!isShift) {
        selectedKeys.clear();
        refreshSelectionStyling();
        notifySelectionChanged();
      }
      if (currentPopup) { currentPopup.remove(); currentPopup = null; }
      return;
    }
    const f = features[0];
    const p = f.properties || {};
    const key = p.d;
    if (key === undefined || key === null) return;

    if (isShift) {
      // Toggle membership
      if (selectedKeys.has(key)) selectedKeys.delete(key);
      else selectedKeys.add(key);
    } else {
      // Replace selection with this one point
      selectedKeys.clear();
      selectedKeys.add(key);
    }
    refreshSelectionStyling();
    notifySelectionChanged();

    // Open the popup with ◀/▶ navigation. Find this fix's index in the
    // (chronological) points array by its 'd' key; openPopupAtIndex builds the
    // popup and wires the arrows. recenter=false so a plain click doesn't shift
    // the map (nav arrows recenter so off-screen neighbours come into view).
    var _feats = (pointsData && pointsData.features) || [];
    var _idx = -1;
    for (var _i = 0; _i < _feats.length; _i++) {
      if (_feats[_i].properties && _feats[_i].properties.d === key) { _idx = _i; break; }
    }
    if (_idx >= 0) openPopupAtIndex(_idx, false);
  });

  // ----- Box-select (Shift+drag) ----------------------------------------
  // Implementation: on mousedown with Shift, prevent map drag (preventDefault),
  // track the rectangle in screen coords with a styled div, on mouseup query
  // features inside the rectangle and add them to selection.
  const boxEl = document.getElementById('box-select');
  let boxStart = null;
  const canvas = map.getCanvas();

  canvas.addEventListener('mousedown', (e) => {
    if (!e.shiftKey || e.button !== 0) return;
    // Prevent default map drag while user holds Shift
    e.preventDefault();
    map.dragPan.disable();
    boxStart = { x: e.clientX, y: e.clientY };
    boxEl.style.left = boxStart.x + 'px';
    boxEl.style.top = boxStart.y + 'px';
    boxEl.style.width = '0px';
    boxEl.style.height = '0px';
    boxEl.style.display = 'block';
  });
  document.addEventListener('mousemove', (e) => {
    if (!boxStart) return;
    const x0 = Math.min(boxStart.x, e.clientX);
    const y0 = Math.min(boxStart.y, e.clientY);
    const w = Math.abs(e.clientX - boxStart.x);
    const h = Math.abs(e.clientY - boxStart.y);
    boxEl.style.left = x0 + 'px';
    boxEl.style.top = y0 + 'px';
    boxEl.style.width = w + 'px';
    boxEl.style.height = h + 'px';
  });
  document.addEventListener('mouseup', (e) => {
    if (!boxStart) return;
    boxEl.style.display = 'none';
    map.dragPan.enable();
    const r = map.getContainer().getBoundingClientRect();
    const p1 = [boxStart.x - r.left, boxStart.y - r.top];
    const p2 = [e.clientX - r.left, e.clientY - r.top];
    boxStart = null;
    const dx = Math.abs(p2[0] - p1[0]);
    const dy = Math.abs(p2[1] - p1[1]);
    if (dx < 4 && dy < 4) return;  // ignore tiny boxes (real click)
    const features = map.queryRenderedFeatures([p1, p2], {
      layers: ['animal-points-layer'],
    });
    for (const f of features) {
      const k = f.properties && f.properties.d;
      if (k !== undefined && k !== null) selectedKeys.add(k);
    }
    refreshSelectionStyling();
    notifySelectionChanged();
  });

  // Pointer cursor on hover
  map.on('mouseenter', 'animal-points-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'animal-points-layer', () => { map.getCanvas().style.cursor = ''; });

  window._mapReady = true;
  window.parent.postMessage({ type: 'map-ready' }, '*');
});

// Listen for data updates from parent Dash app
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.type) return;

  if (d.type === 'update-data') {
    if (currentPopup) { currentPopup.remove(); currentPopup = null; }
    if (d.env_labels) LABELS = Object.assign({}, LABELS, d.env_labels);
    if (d.points) {
      pointsData = d.points;
      map.getSource('animal-points').setData(d.points);
    }
    if (d.line) map.getSource('animal-line').setData(d.line);
    // Selection is animal-scoped; a new dataset implicitly clears it.
    selectedKeys.clear();
    refreshSelectionStyling();
    notifySelectionChanged();
    if (d.center && d.zoom != null) {
      map.flyTo({ center: [d.center[1], d.center[0]], zoom: d.zoom, duration: 600 });
    }
  }

  if (d.type === 'set-legend') {
    _legendSeqs = Array.isArray(d.seqs) ? d.seqs : [];
    var _lp = document.getElementById('legend-panel');
    if (_lp && _lp.classList.contains('open')) buildLegend();  // live-update if open
  }

  if (d.type === 'flash-point') {
    // Find the feature whose 'd' (timestamp) matches and pulse a cyan
    // halo around it for ~1.6 s. Pan the map so the point is on-screen.
    if (!d.d) return;
    // Exact-match first; if that misses (the map subsamples to ~3000 pts on
    // large herds, so the click timestamp may not exist on the map), fall
    // back to the feature closest in time.
    const targetMs = Date.parse(d.d.replace(' ', 'T') + 'Z');
    let match = (pointsData.features || []).find(f => f.properties && f.properties.d === d.d);
    if (!match && !isNaN(targetMs)) {
      let bestDelta = Infinity;
      for (const f of (pointsData.features || [])) {
        const fd = f.properties && f.properties.d;
        if (!fd) continue;
        const fMs = Date.parse(fd.replace(' ', 'T') + 'Z');
        if (isNaN(fMs)) continue;
        const delta = Math.abs(fMs - targetMs);
        if (delta < bestDelta) { bestDelta = delta; match = f; }
      }
    }
    if (!match) return;
    const coords = match.geometry.coordinates;
    const flashSrc = map.getSource('flash-halo');
    flashSrc.setData({ type: 'FeatureCollection', features: [match] });
    // Pulse: 4 fades over ~1.6 s, then clear.
    const layer = 'flash-halo-layer';
    let step = 0;
    const tick = setInterval(() => {
      step++;
      const op = (step % 2 === 0) ? 1.0 : 0.25;
      map.setPaintProperty(layer, 'circle-stroke-opacity', op);
      if (step >= 8) {
        clearInterval(tick);
        map.setPaintProperty(layer, 'circle-stroke-opacity', 1.0);
        flashSrc.setData({ type: 'FeatureCollection', features: [] });
      }
    }, 200);
    // Gently pan if the point isn't already in view.
    const bounds = map.getBounds();
    if (!bounds.contains(coords)) {
      map.easeTo({ center: coords, duration: 500 });
    }
  }

  if (d.type === 'clear-selection') {
    selectedKeys.clear();
    refreshSelectionStyling();
    notifySelectionChanged();
  }

  if (d.type === 'set-basemap') {
    const src = map.getSource('satellite');
    if (d.basemap === 'topo') {
      src.setTiles(['https://tile.opentopomap.org/{z}/{x}/{y}.png']);
    } else {
      src.setTiles(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']);
    }
  }
});
</script>
</body>
</html>
